<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Windows Command Prompt Style</title>
  <style>
    body {
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .terminal {
      background-color: #000000;
      color: #C0C0C0;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 700px;
      box-shadow: 0 0 10px rgba(0,0,0,0.7);
      font-size: 16px;
      line-height: 1.6;
    }

    .terminal pre {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <pre>
Microsoft Windows [Version 10.0.22621.3007]
(c) Microsoft Corporation. All rights reserved.

C:\Users\Student&gt;mkdir shivam

C:\Users\Student&gt;rmdir shivam

C:\Users\Student&gt;cd..

C:\Users&gt;cd Student

C:\Users&gt;cd
C:\Users&gt;
    </pre>
  </div>
</body>
</html>
