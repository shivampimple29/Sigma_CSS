<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font-Wt and Txt-Decn</title>
</head>
<body align="center">
    <h1>Font Weight</h1>
    <h2 style="font-weight: 100;">Light</h2>
    <h2 style="font-weight: 400;">Normal</h2>
    <h2 style="font-weight: 900;">Bold</h2>

    <h1>Text-Decoration</h1>
    <h2 style="text-decoration: underline;">underline</h2>
    <h2 style="text-decoration: line-through;">line-through</h2>
    <h2 style="text-decoration: overline;">overline</h2>
    <h2><a href="#">link</a></h2>
    <h2><a href="#" style="text-decoration: none;">link</a></h2>
</body>
</html>
